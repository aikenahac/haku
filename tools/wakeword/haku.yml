# openWakeWord training config for "Haku".
# Used by train_haku.sh. Paths are relative to the work dir it creates.
model_name: "haku"
# Several spellings so the TTS sample generator pronounces it "HAH-koo".
target_phrase:
  - "haku"
  - "hah koo"
  - "hey haku"
custom_negative_phrases:
  - "haiku"
  - "hockey"
  - "hello"
  - "thank you"
  - "how could"
  - "a cool"
n_samples: 50000
n_samples_val: 2000
tts_batch_size: 50
augmentation_batch_size: 16
piper_sample_generator_path: "./piper-sample-generator"
output_dir: "./out"
rir_paths:
  - "./mit_rirs"
background_paths:
  - "./audioset_16k"
  - "./fma"
background_paths_duplication_rate:
  - 1
  - 1
false_positive_validation_data_path: "./validation_set_features.npy"
augmentation_rounds: 1
feature_data_files:
  "ACAV100M_sample": "./openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50
model_type: "dnn"
layer_size: 32
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
