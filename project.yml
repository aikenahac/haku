name: Haku
options:
  bundleIdPrefix: dev.haku
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Haku:
    type: application
    platform: macOS
    sources:
      - path: Haku
        excludes:
          - "Resources/Fonts/**"
      - path: Haku/Resources/Fonts
        type: folder
        buildPhase: resources
    info:
      path: Haku/Info.plist
      properties:
        CFBundleDisplayName: Haku
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.haku.Haku
            CFBundleURLSchemes: [haku]
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Fonts: SIL Open Font License 1.1 (see Fonts/OFL-*.txt)"
        ATSApplicationFontsPath: Fonts
        NSMicrophoneUsageDescription: "Haku listens while you hold the talk hotkey or answer a prompt."
        NSSpeechRecognitionUsageDescription: "Haku turns what you say into text on this Mac."
        NSAppleEventsUsageDescription: "Haku runs AppleScripts you approve."
        NSScreenCaptureUsageDescription: "Haku attaches a screenshot only when you ask it to."
        NSUserNotificationsUsageDescription: "Haku tells you when an agent job finishes."
    dependencies:
      - package: KeyboardShortcuts
      - package: WhisperKit
    entitlements:
      path: Haku/Haku.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haku.Haku
        PRODUCT_NAME: Haku
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7LG2A4237Y
        CODE_SIGN_IDENTITY: "Apple Development"
        COMBINE_HIDPI_IMAGES: YES
  HakuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HakuTests
    dependencies:
      - target: Haku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haku.HakuTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Haku.app/Contents/MacOS/Haku"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7LG2A4237Y
schemes:
  Haku:
    build:
      targets:
        Haku: all
        HakuTests: [test]
    test:
      targets:
        - HakuTests
